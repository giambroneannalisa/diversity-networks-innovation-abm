name: Export extension fronts

# Recovers the extension Pareto fronts from a previous run's artifacts and
# pushes them to the orphan branch `extension-fronts`, which can be fetched
# with git where the artifact download API is not reachable. For seeds whose
# run hit the time limit it derives the non-dominated front at the last
# completed generation and names the file accordingly.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID whose artifacts to export'
        required: true
        default: '30167710986'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: results-seed-*
          path: extension
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect all fronts into pack/
        run: |
          mkdir -p pack
          cp extension/pareto_seed*.csv pack/ 2>/dev/null || true
          python3 - <<'EOF'
          import csv, glob, io, os, re
          COLS = ['bridging-capital-weight', 'innovation-diffusion-rate',
                  'policy-effectiveness', 'cultural-diffusion-rate',
                  'Obj_Innov_Neg', 'Obj_Div_Neg', 'Obj_Gini']
          def dominates(a, b):
              o = ('Obj_Innov_Neg', 'Obj_Div_Neg', 'Obj_Gini')
              return all(float(a[k]) <= float(b[k]) for k in o) and \
                     any(float(a[k]) <  float(b[k]) for k in o)
          for p in glob.glob('extension/trajectory_seed*_checkpoint.csv'):
              s = int(re.search(r'seed(\d+)', p).group(1))
              if os.path.exists(f'extension/pareto_seed{s}.csv'):
                  continue
              rows = [r for r in csv.DictReader(open(p)) if r.get('Obj_Gini')]
              last = max(int(r['Generation']) for r in rows)
              pop = [r for r in rows if int(r['Generation']) == last]
              front = [a for a in pop if not any(dominates(b, a) for b in pop if b is not a)]
              seen, uniq = set(), []
              for r in front:
                  k = tuple(r[c] for c in COLS)
                  if k not in seen:
                      seen.add(k); uniq.append(r)
              with open(f'pack/pareto_seed{s}_gen{last}_partial.csv', 'w', newline='') as f:
                  w = csv.writer(f, lineterminator='\n')
                  w.writerow(COLS)
                  for r in uniq:
                      w.writerow([r[c] for c in COLS])
          EOF
          ls -la pack/
          md5sum pack/*

      - name: Push pack/ to the extension-fronts branch
        # Git is reachable where the artifact API is not, so a side branch is
        # the recovery channel: the files arrive byte-for-byte, not re-encoded.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/side && cp pack/* /tmp/side/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan extension-fronts
          git rm -rf --cached . >/dev/null
          find . -maxdepth 1 -mindepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/side/* .
          git add -A
          git commit -m "Extension Pareto fronts recovered from run ${{ inputs.run_id }}"
          git push -f origin extension-fronts
          echo "pushed:"; git show --stat --oneline HEAD
