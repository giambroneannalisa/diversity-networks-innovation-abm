name: Export completed seeds

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run holding the completed-seed artifacts'
        required: true
        default: '30764504158'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download completed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: completed-seed-*
          path: done
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inventory and checksums
        run: |
          ls -la done/
          md5sum done/* | sort -k2
      - name: Push to the completed-seeds branch
        run: |
          mkdir -p /tmp/side && cp done/* /tmp/side/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan completed-seeds
          git rm -rf --cached . >/dev/null
          find . -maxdepth 1 -mindepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/side/* .
          git add -A
          git commit -m "Completed generation-50 runs from ${{ inputs.run_id }}"
          git push -f origin completed-seeds
