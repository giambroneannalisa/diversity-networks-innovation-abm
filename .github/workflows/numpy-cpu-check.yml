name: numpy CPU dispatch check

# The reproducibility pilot found generation 1 identical and the first
# offspring of generation 2 different by one unit in the last place of a
# single parameter, with the NetLogo results for that individual unchanged.
# That points away from the simulator and at the optimiser's arithmetic.
#
# numpy 2 selects vectorised kernels at run time from the CPU's instruction
# set. GitHub's hosted runners are not a single CPU model, so two runs of the
# same code on the same image can take different SIMD paths through
# transcendental functions — and SBX raises to a fractional power.
#
# This job tests exactly that, with no NetLogo and no ABM involved: several
# runners each execute an identical NSGA-II run on an analytic problem with a
# fixed seed, and print the CPU model, numpy's dispatch state, and a digest of
# the result. Identical digests across differing CPUs would exonerate numpy;
# digests that track the CPU model would confirm it.

on:
  workflow_dispatch:
    inputs:
      replicas:
        description: 'JSON array of replica indices'
        required: true
        default: '[1,2,3,4,5,6,7,8]'
      disable_features:
        description: 'NPY_DISABLE_CPU_FEATURES value (empty = numpy default)'
        required: false
        # numpy 2.4.6 wheels are built with exactly four dispatch targets:
        # X86_V3 X86_V4 AVX512_ICL AVX512_SPR. Only those names mean anything
        # here — a name outside that list (AVX512F, AVX512_SKX, ...) is not
        # a stricter request, it is a no-op. Disabling the upper three holds
        # every machine to the X86_V3 (AVX2) kernels, which the whole runner
        # pool supports.
        default: 'X86_V4 AVX512_ICL AVX512_SPR'

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      NPY_DISABLE_CPU_FEATURES: ${{ inputs.disable_features }}
    strategy:
      fail-fast: false
      matrix:
        replica: ${{ fromJSON(inputs.replicas) }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install "pymoo==0.6.2" "pandas==3.0.5" "numpy==2.4.6" "scipy==1.17.1"

      - name: Probe
        run: |
          exec > >(tee probe.txt) 2>&1
          echo "replica ${{ matrix.replica }}"
          echo "NPY_DISABLE_CPU_FEATURES=[${NPY_DISABLE_CPU_FEATURES}]"
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 'cpu family' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|avx512f|avx512_|sse4_2)' | tr '\n' ' '; echo
          python3 - <<'EOF'
          import hashlib
          import numpy as np
          from numpy._core._multiarray_umath import (
              __cpu_baseline__, __cpu_dispatch__, __cpu_features__)

          enabled = sorted(f for f in __cpu_dispatch__ if __cpu_features__.get(f))
          print("numpy baseline:", " ".join(__cpu_baseline__))
          print("numpy dispatch built:", " ".join(__cpu_dispatch__))
          print("numpy dispatch enabled:", " ".join(enabled))

          # 1. the bare arithmetic SBX performs: a fractional power
          rng = np.random.default_rng(789)
          v = rng.random(10_000) + 0.5
          p = np.power(v, 1.0 / 16.0)          # SBX uses 1/(eta+1), eta=15
          print("power digest:", hashlib.sha256(p.tobytes()).hexdigest()[:32])

          # 2. the whole optimiser, same configuration as the experiment,
          #    on an analytic problem so nothing outside numpy can vary
          from pymoo.algorithms.moo.nsga2 import NSGA2
          from pymoo.operators.crossover.sbx import SBX
          from pymoo.operators.mutation.pm import PM
          from pymoo.optimize import minimize
          from pymoo.problems import get_problem

          res = minimize(get_problem("zdt1"),
                         NSGA2(pop_size=50, n_offsprings=10,
                               crossover=SBX(prob=0.9, eta=15),
                               mutation=PM(eta=20),
                               eliminate_duplicates=True),
                         ("n_gen", 30), seed=789, verbose=False)
          print("nsga2 X digest:", hashlib.sha256(res.X.tobytes()).hexdigest()[:32])
          print("nsga2 F digest:", hashlib.sha256(res.F.tobytes()).hexdigest()[:32])
          EOF

      - name: Keep this replica's line
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.replica }}
          path: probe.txt
          retention-days: 7

  # One log to read instead of one per replica. With twenty runners per arm,
  # reading the matrix job by job is the slowest part of the whole diagnosis;
  # this collapses it to a single table that also states the verdict, so a
  # reader cannot mistake "all digests agree" for "the pin works" when the
  # draw happened to contain only one class of CPU.
  summary:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: probe-*
          path: results

      - name: Table and verdict
        run: |
          python3 - <<'EOF'
          import glob, os, re, collections

          rows = []
          for path in sorted(glob.glob("results/probe-*/probe.txt")):
              text = open(path).read()
              def field(label, default="?"):
                  m = re.search(rf"^{re.escape(label)}:?\s*(.*)$", text, re.M)
                  return m.group(1).strip() if m else default
              replica = re.search(r"^replica (\S+)", text, re.M)
              flags = [l for l in text.splitlines() if l.startswith("sse4_2")]
              rows.append({
                  "replica": replica.group(1) if replica else "?",
                  "pin": field("NPY_DISABLE_CPU_FEATURES=[").rstrip("]") or "(none)",
                  "cpu": field("model name").lstrip(": ").strip(),
                  "avx512": "yes" if any("avx512f" in f for f in flags) else "no",
                  "enabled": field("numpy dispatch enabled"),
                  "power": field("power digest"),
                  "x": field("nsga2 X digest"),
              })

          w = max(len(r["cpu"]) for r in rows) if rows else 10
          print(f"{'rep':>4}  {'cpu':<{w}}  {'avx512':<6}  {'numpy kernels':<28}  nsga2 X digest")
          for r in sorted(rows, key=lambda r: int(r["replica"])):
              print(f"{r['replica']:>4}  {r['cpu']:<{w}}  {r['avx512']:<6}  {r['enabled']:<28}  {r['x']}")

          pins = {r["pin"] for r in rows}
          classes = collections.Counter(r["avx512"] for r in rows)
          digests = collections.Counter(r["x"] for r in rows)
          print()
          print("pin value        :", " | ".join(sorted(pins)))
          print("hardware classes :", dict(classes))
          print("distinct digests :", dict(digests))
          print()
          if len(classes) < 2:
              print("VERDICT: INCONCLUSIVE — only one hardware class was drawn, so the")
              print("pin was never exercised. Identical digests here prove nothing.")
          elif len(digests) == 1:
              print("VERDICT: digests identical across BOTH hardware classes.")
          else:
              print("VERDICT: digests differ across hardware classes.")
          EOF
