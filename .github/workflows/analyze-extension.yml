name: Analyze extension results

# Runs analyze_fronts.py over the artifacts of a previous 10-seed run and
# prints the statistics to the job log (results are not committed).
# Useful when the artifacts cannot be downloaded locally.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID whose artifacts to analyze'
        required: true
        default: '30167710986'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install numpy (needed by the determinism check)
        run: pip install numpy --quiet

      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: results-seed-*
          path: extension
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inventory
        run: |
          echo "=== files retrieved ==="
          ls -la extension/
          echo
          echo "=== completeness per seed ==="
          python3 - <<'EOF'
          import glob, os, re, csv
          seeds = sorted({int(re.search(r'seed(\d+)', os.path.basename(p)).group(1))
                          for p in glob.glob('extension/*seed*.csv')})
          for s in seeds:
              pareto = f'extension/pareto_seed{s}.csv'
              traj   = f'extension/trajectory_seed{s}.csv'
              ckpt   = f'extension/trajectory_seed{s}_checkpoint.csv'
              reps   = f'extension/replicates_seed{s}.csv'
              def gens(p):
                  if not os.path.exists(p): return None
                  with open(p) as f:
                      rows = [r for r in csv.DictReader(f) if r.get('Generation')]
                  return max(int(r['Generation']) for r in rows) if rows else 0
              status = 'COMPLETE' if os.path.exists(pareto) else 'partial (timed out)'
              print(f"seed {s:>5}: {status:20s} final-traj gen={gens(traj)} "
                    f"checkpoint gen={gens(ckpt)} "
                    f"pareto rows={sum(1 for _ in open(pareto))-1 if os.path.exists(pareto) else '-'} "
                    f"replicate-log rows={sum(1 for _ in open(reps))-1 if os.path.exists(reps) else '-'}")
          EOF

      - name: Determinism check on replicate seeds
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import glob, csv, os, re
          # v2 derives NetLogo seeds from (master seed, eval index): the seed for
          # a given (master, eval, replicate) must be identical across runs.
          # Here we verify internal consistency: same eval index never reuses a seed,
          # and the first evaluation's seeds are reproducible from SeedSequence.
          import numpy as np
          for p in sorted(glob.glob('extension/replicates_seed*.csv')):
              s = int(re.search(r'seed(\d+)', p).group(1))
              with open(p) as f:
                  rows = list(csv.DictReader(f))
              if not rows: continue
              ev0 = [r for r in rows if r['eval_index'] == '0']
              logged = [int(r['netlogo_seed']) for r in ev0]
              ss = np.random.SeedSequence([s, 0])
              expected = [int(x % 2147483646) + 1 for x in ss.generate_state(len(logged), dtype=np.uint64)]
              print(f"seed {s:>5}: eval 0 replicate seeds logged={logged} expected={expected} "
                    f"MATCH={logged == expected}")
          EOF

      - name: Cross-seed analysis
        if: always()
        run: |
          echo "=== analyze_fronts.py over all available Pareto fronts ==="
          python3 analyze_fronts.py extension
